[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /run/klipper/ud_sock

# Host-specific [authorization] (trusted clients, CORS domains), see examples/moonraker-local.conf.example
[include /etc/klipper/moonraker-local.conf]

# Lets Fluidd start and stop the services listed in moonraker.asvc
[machine]
provider: systemd_dbus

[octoprint_compat]

[history]

[update_manager]
# enable_repo_debug: False
enable_system_updates: False
