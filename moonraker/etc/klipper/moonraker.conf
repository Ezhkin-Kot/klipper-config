[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /run/klipper/ud_sock

# [authorization] (trusted clients, CORS domains) is host specific and lives in
# /etc/klipper/moonraker-local.conf, created by install.sh from examples/moonraker-local.conf.example
[include /etc/klipper/moonraker-local.conf]

[octoprint_compat]

[history]

[update_manager]
# enable_repo_debug: False
enable_system_updates: False
