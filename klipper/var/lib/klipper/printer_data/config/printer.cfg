################################################################################
# Board: MKS Robin Nano v1.3
# Printer: Flying Bear Ghost 5
# Config by Ezhkin-Kot (based on ODUCCEU)
################################################################################

# Documentation
# https://www.klipper3d.org/Config_Reference.html

# It is recommended that you follow these steps to properly calibrate your printer:
# 1) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
# 2) Skew Correction: https://www.klipper3d.org/skew_correction.html
# 3) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html
# 4) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html

################################################################################
# Included configs
################################################################################

[include mks-rn-13.cfg]                                                         # MKS Robin Nano v1.3 https://github.com/oducceu/klipper_configs/blob/master/images/mks-rn-13.png

## Base configuration ##########################################################
[include fb-ghost5.cfg]

## Base macros #################################################################
[include macros/macros.cfg]

## Additional hardware #########################################################
[include fb-ghost5-bltouch.cfg]                                                 # disable 'position_endstop' in [stepper_z] section

################################################################################
# X, Y, Z
################################################################################

[stepper_x]
homing_speed: 100

[stepper_y]
homing_speed: 100

[stepper_z]
homing_speed: 15
# position_endstop: 0.062                                                         # disable if using BLTouch to use 'probe:z_virtual_endstop'

################################################################################
# E0, HB
################################################################################

[extruder]
rotation_distance: 7.7786                                                       # CAUTION! Calibrate using https://www.klipper3d.org/Rotation_Distance.html
nozzle_diameter: 0.400
pressure_advance: 0.055                                                         # CAUTION! Calibrate using https://www.klipper3d.org/Pressure_Advance.html
#control: pid                                                                    # CAUTION! Calibrate using PID_CALIBRATE https://www.klipper3d.org/G-Codes.html#extended-g-code-commands
#pid_Kp: 30.891
#pid_Ki: 2.542
#pid_Kd: 93.830
# min_extrude_temp: 0                                                           # allow Cold Extrusion for extruder steps calibration

[heater_bed]
#control: pid                                                                    # CAUTION! Calibrate using PID_CALIBRATE https://www.klipper3d.org/G-Codes.html#extended-g-code-commands
#pid_Kp: 63.104
#pid_Ki: 2.350
#pid_Kd: 423.586

################################################################################
# Printer
################################################################################

[mcu]
# serial: /dev/ttyAMA0                                                          # enable if connected via UART1 on Pi3/PiZ
# serial: /dev/ttyAMA1                                                          # enable if connected via UART5 on Pi4

[printer]
max_velocity: 150
max_accel: 3000
# max_accel_to_decel: 2000                                                      # deprecated
minimum_cruise_ratio: 0.5

################################################################################
# Bed leveling
################################################################################

[bed_screws]
screw5: 127.5,105
screw5_name: center virtual screw

################################################################################
# Resonance compensation
################################################################################

[input_shaper]

